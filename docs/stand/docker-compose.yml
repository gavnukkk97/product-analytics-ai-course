# Учебный стенд Ритм: Postgres + Metabase
# Порты нестандартные, чтобы не конфликтовать с другими агентами/сервисами.
#
# Подъём:  cp .env.example .env && docker compose up -d
# Metabase UI: http://localhost:${METABASE_PORT:-3847}
# Postgres:    localhost:${POSTGRES_PORT:-54329}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ritm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ritm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ritm_local}
      POSTGRES_DB: ${POSTGRES_DB:-ritm}
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    volumes:
      - ritm_pg_data:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_views.sql:/docker-entrypoint-initdb.d/02_views.sql:ro
      - ./sql/03_seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ritm} -d ${POSTGRES_DB:-ritm}"]
      interval: 5s
      timeout: 5s
      retries: 12

  metabase:
    image: metabase/metabase:v0.53.6
    container_name: ritm-metabase
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_FILE: ${METABASE_DB_FILE:-/metabase-data/metabase.db}
      JAVA_TIMEZONE: Europe/Moscow
    ports:
      - "${METABASE_PORT:-3847}:3000"
    volumes:
      - ritm_metabase_data:/metabase-data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  ritm_pg_data:
  ritm_metabase_data:
