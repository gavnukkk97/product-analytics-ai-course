<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Tracking plan as contract table</title>
  <desc id="desc">Seven contract columns with Ritм example rows for habit_created, check_in, paywall_view.</desc>
  <defs>
    <style>
      .bg { fill: #FBF8F2; }
      .title { font-family: Georgia, 'Times New Roman', serif; font-size: 20px; fill: #1C2B24; }
      .hint { font-family: system-ui, sans-serif; font-size: 12px; fill: #4A5C52; }
      .h { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #1C2B24; text-anchor: middle; }
      .c { font-family: system-ui, sans-serif; font-size: 11px; fill: #1C2B24; text-anchor: middle; }
      .s { font-family: system-ui, sans-serif; font-size: 10px; fill: #4A5C52; text-anchor: middle; }
      .head { fill: #DCE8DF; stroke: #2F4A3E; stroke-width: 1.5; }
      .cell { fill: #F7F3EB; stroke: #2F4A3E; stroke-width: 1.2; }
      .focus { fill: #F3E6DF; stroke: #8B3A2F; stroke-width: 1.8; }
    </style>
  </defs>
  <rect class="bg" width="960" height="540"/>
  <text x="36" y="36" class="title">Tracking plan — контракт разметки «Ритм»</text>
  <text x="36" y="58" class="hint">Строка = событие с вопросом решения. Смотрите: вопрос → имя → триггер → проверка.</text>
  <rect class="head" x="24" y="80" width="130" height="44" rx="4"/>
  <rect class="head" x="154" y="80" width="130" height="44" rx="4"/>
  <rect class="head" x="284" y="80" width="150" height="44" rx="4"/>
  <rect class="head" x="434" y="80" width="140" height="44" rx="4"/>
  <rect class="head" x="574" y="80" width="110" height="44" rx="4"/>
  <rect class="head" x="684" y="80" width="100" height="44" rx="4"/>
  <rect class="head" x="784" y="80" width="152" height="44" rx="4"/>
  <text class="h" x="89" y="106">Вопрос</text>
  <text class="h" x="219" y="106">Событие</text>
  <text class="h" x="359" y="106">Триггер</text>
  <text class="h" x="504" y="106">Свойства</text>
  <text class="h" x="629" y="106">Зерно</text>
  <text class="h" x="734" y="106">Владелец</text>
  <text class="h" x="860" y="106">Проверка</text>
  <rect class="cell" x="24" y="130" width="130" height="70" rx="4"/>
  <rect class="focus" x="154" y="130" width="130" height="70" rx="4"/>
  <rect class="cell" x="284" y="130" width="150" height="70" rx="4"/>
  <rect class="cell" x="434" y="130" width="140" height="70" rx="4"/>
  <rect class="cell" x="574" y="130" width="110" height="70" rx="4"/>
  <rect class="cell" x="684" y="130" width="100" height="70" rx="4"/>
  <rect class="cell" x="784" y="130" width="152" height="70" rx="4"/>
  <text class="c" x="89" y="158">Знаменатель</text>
  <text class="s" x="89" y="176">depth ≥3</text>
  <text class="c" x="219" y="158">habit_created</text>
  <text class="s" x="219" y="176">не button_ok</text>
  <text class="c" x="359" y="158">сохранена</text>
  <text class="s" x="359" y="176">первая привычка</text>
  <text class="c" x="504" y="158">habit_id,</text>
  <text class="s" x="504" y="176">habit_type</text>
  <text class="c" x="629" y="158">user ×</text>
  <text class="s" x="629" y="176">момент</text>
  <text class="c" x="734" y="158">аналитик</text>
  <text class="c" x="860" y="158">1-е за</text>
  <text class="s" x="860" y="176">онбординг</text>
  <rect class="cell" x="24" y="210" width="130" height="70" rx="4"/>
  <rect class="focus" x="154" y="210" width="130" height="70" rx="4"/>
  <rect class="cell" x="284" y="210" width="150" height="70" rx="4"/>
  <rect class="cell" x="434" y="210" width="140" height="70" rx="4"/>
  <rect class="cell" x="574" y="210" width="110" height="70" rx="4"/>
  <rect class="cell" x="684" y="210" width="100" height="70" rx="4"/>
  <rect class="cell" x="784" y="210" width="152" height="70" rx="4"/>
  <text class="c" x="89" y="238">Числитель</text>
  <text class="s" x="89" y="256">depth ≥3</text>
  <text class="c" x="219" y="238">check_in</text>
  <text class="c" x="359" y="238">commit дня</text>
  <text class="s" x="359" y="256">не случайный свайп</text>
  <text class="c" x="504" y="238">habit_id,</text>
  <text class="s" x="504" y="256">local_date</text>
  <text class="c" x="629" y="238">user ×</text>
  <text class="s" x="629" y="256">habit × день</text>
  <text class="c" x="734" y="238">mobile</text>
  <text class="c" x="860" y="238">нет дублей</text>
  <text class="s" x="860" y="256">на день</text>
  <rect class="cell" x="24" y="290" width="130" height="70" rx="4"/>
  <rect class="cell" x="154" y="290" width="130" height="70" rx="4"/>
  <rect class="cell" x="284" y="290" width="150" height="70" rx="4"/>
  <rect class="cell" x="434" y="290" width="140" height="70" rx="4"/>
  <rect class="cell" x="574" y="290" width="110" height="70" rx="4"/>
  <rect class="cell" x="684" y="290" width="100" height="70" rx="4"/>
  <rect class="cell" x="784" y="290" width="152" height="70" rx="4"/>
  <text class="c" x="89" y="318">Рано ли</text>
  <text class="s" x="89" y="336">продаём</text>
  <text class="c" x="219" y="318">paywall_view</text>
  <text class="c" x="359" y="318">показ пейвола</text>
  <text class="c" x="504" y="318">trigger</text>
  <text class="s" x="504" y="336">streak_3 | day_7</text>
  <text class="c" x="629" y="318">user ×</text>
  <text class="s" x="629" y="336">день (дедуп)</text>
  <text class="c" x="734" y="318">продакт</text>
  <text class="c" x="860" y="318">доля до</text>
  <text class="s" x="860" y="336">streak_3</text>
  <text x="36" y="400" class="hint">Вывод: без колонки «вопрос» событие — шум. Имена в фокусе — глаголы продукта, не UI-декор.</text>
  <text x="36" y="430" class="hint">Дальше: 10–15 таких строк на сценарий онбординг → Pro; QA до релиза обязательна.</text>
  <rect x="36" y="460" width="18" height="18" fill="#F3E6DF" stroke="#8B3A2F" stroke-width="1.5"/>
  <text x="62" y="474" class="hint">акцент — события ядра метрики depth</text>
</svg>
