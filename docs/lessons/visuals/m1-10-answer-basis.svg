<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Answer basis consequence frame</title>
  <desc id="desc">Three-part defense frame: answer, evidence, business consequence with uncertainty.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2F4A3E"/>
    </marker>
<style>
      .bg { fill: #FBF8F2; }
      .title { font-family: Georgia, 'Times New Roman', serif; font-size: 20px; fill: #1C2B24; }
      .hint { font-family: system-ui, sans-serif; font-size: 12px; fill: #4A5C52; }
      .h { font-family: Georgia, serif; font-size: 13px; fill: #1C2B24; text-anchor: middle; }
      .t { font-family: system-ui, sans-serif; font-size: 11px; fill: #1C2B24; text-anchor: middle; }
      .s { font-family: system-ui, sans-serif; font-size: 10px; fill: #4A5C52; text-anchor: middle; }
      .box { fill: #F7F3EB; stroke: #2F4A3E; stroke-width: 1.8; }
      .ok { fill: #DCE8DF; stroke: #2F4A3E; stroke-width: 1.8; }
      .focus { fill: #F3E6DF; stroke: #8B3A2F; stroke-width: 2.2; }
      .pri { fill: #DCE8DF; stroke: #2F4A3E; stroke-width: 2; }
      .warn { fill: #F3E6DF; stroke: #8B3A2F; stroke-width: 2; }
      .e { stroke: #2F4A3E; stroke-width: 1.8; fill: none; marker-end: url(#arr); }
</style></defs>
  <rect class="bg" width="960" height="500"/>
  <text x="36" y="32" class="title">Ответ → основание → следствие · М1.10</text>
  <text x="36" y="52" class="hint">Защита P4: одна фраза-решение, доказательства, деньги и риск — без «кажется, выросло».</text>

  <rect class="pri" x="40" y="90" width="280" height="160" rx="6"/>
  <text class="h" x="180" y="125">1. Ответ</text>
  <text class="t" x="180" y="155">Растим treatment</text>
  <text class="t" x="180" y="175">paywall после streak_3</text>
  <text class="s" x="180" y="205">Не: «метрики улучшились»</text>
  <text class="s" x="180" y="225">Да: глагол решения</text>

  <rect class="box" x="340" y="90" width="280" height="160" rx="6"/>
  <text class="h" x="480" y="125">2. Основание</text>
  <text class="t" x="480" y="155">Primary +N п.п.</text>
  <text class="t" x="480" y="175">N, окно, ДИ / шум</text>
  <text class="s" x="480" y="205">Guardrails в норме</text>
  <text class="s" x="480" y="225">Словарь М5.1</text>

  <rect class="focus" x="640" y="90" width="280" height="160" rx="6"/>
  <text class="h" x="780" y="125">3. Следствие</text>
  <text class="t" x="780" y="155">₽ на волну / месяц</text>
  <text class="t" x="780" y="175">Что делаем завтра</text>
  <text class="s" x="780" y="205">Цена ошибки I / II</text>
  <text class="s" x="780" y="225">Что мониторим</text>

  <path class="e" d="M320 170 H335"/>
  <path class="e" d="M620 170 H635"/>

  <rect class="warn" x="120" y="300" width="720" height="100" rx="6"/>
  <text class="h" x="480" y="335">Неопределённость без обесценивания</text>
  <text class="t" x="480" y="360">«ДИ включает 0» ≠ «ничего не знаем»</text>
  <text class="s" x="480" y="385">Сказать: диапазон эффекта · что решили при этом диапазоне · какой следующий шаг</text>

  <text x="36" y="450" class="hint">Смотреть: решение и деньги в одном абзаце; p-value без следствия — провал защиты. М1.10 · P4</text>
</svg>
